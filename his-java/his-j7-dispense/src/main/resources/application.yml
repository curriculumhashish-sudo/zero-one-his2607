server:
  port:  ${sp.dispense}
  servlet:
    context-path: /dispense
spring:
  config:
    import: nacos:data-source.yaml,nacos:system.yaml
  application:
    name: ${sn.dispense}
  cloud:
    sentinel:
      transport:
        dashboard: ${sentinel.dashboard}
        port: 8721
      eager: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.zero.star.dispense.controller
  group-configs:
    - group: "发药管理"
      display-name: "发药管理"
      paths-to-match: /api/j7/outpharm/**
      packages-to-scan: com.zero.star.dispense.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

feign:
  sentinel:
    enabled: true