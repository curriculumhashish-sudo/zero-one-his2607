server:
  port: ${sp.j7-dispense}
  servlet:
    context-path: /j7-dispense

spring:
  application:
    name: ${sn.j7-dispense}
  config:
    import:
      - optional:nacos:data-source.yaml
      - optional:nacos:key-config.yaml
      - optional:nacos:system.yaml
      - optional:nacos:third-services.yaml
      - optional:nacos:gateway.yaml
      - optional:nacos:j7-pharmacy-dev.yaml
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: his-dev
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: his-dev