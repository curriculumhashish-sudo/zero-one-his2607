spring:
  #nacos配置
  #https://github.com/alibaba/spring-cloud-alibaba/blob/2025.0.x/spring-cloud-alibaba-examples/nacos-example/readme-zh.md
  cloud:
    nacos:
      server-addr: 192.168.6.100:8848
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: his-dev
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        namespace: his-dev
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    sentinel:
      transport:
        #本机的IP地址，客户端给sentinel监控使用，不配置可能会识别成其他网卡的ip导致错误
        client-ip: 192.168.6.100

#开启MP SQL日志打印
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 开启调试日志方便查看错误信息
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
