spring:
  #nacos配置
  #https://github.com/alibaba/spring-cloud-alibaba/blob/2025.0.x/spring-cloud-alibaba-examples/nacos-example/readme-zh.md
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:root}
      discovery:
        namespace: hei-dev
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:root}
      config:
        namespace: hei-dev
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:root}
    sentinel:
      transport:
        #本机的IP地址，客户端给sentinel监控使用，不配置可能会识别成其他网卡的ip导致错误
        client-ip: ${LOCAL_IP:127.0.0.1}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/zo_his?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    druid:
      name: DruidDataSource
      initial-size: 1
      min-idle: 1
      max-active: 20
      max-wait: 6000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

#开启MP SQL日志打印
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 开启调试日志方便查看错误信息
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
