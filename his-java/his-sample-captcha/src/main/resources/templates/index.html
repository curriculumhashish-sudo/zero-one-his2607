<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证码效果示例页面</title>
    <link rel="stylesheet" th:href="@{/tac/css/tac.css}">
    <link rel="stylesheet" th:href="@{/index.css(v=${#dates.createNow().time})}">
    <script th:src="@{/jquery.min.js}"></script>
    <script th:src="@{/tac/js/tac.min.js}"></script>
</head>

<body>
<div class="container">
    <div class="header">
        <h1>🔐 验证码演示系统</h1>
        <p>选择下方不同类型的验证码进行体验</p>
    </div>

    <div class="captcha-types">
        <button class="captcha-type-btn active" onclick="openCaptcha('RANDOM', this)">🎲 随机验证码</button>
        <button class="captcha-type-btn" onclick="openCaptcha('SLIDER', this)">🎯 滑块验证码</button>
        <button class="captcha-type-btn" onclick="openCaptcha('ROTATE', this)">🔄 旋转验证码</button>
        <button class="captcha-type-btn" onclick="openCaptcha('CONCAT', this)">🧩 滑动还原验证码</button>
        <button class="captcha-type-btn" onclick="openCaptcha('WORD_IMAGE_CLICK', this)">👆 点选验证码</button>
    </div>

    <div class="captcha-container">
        <div id="captcha-box"></div>
    </div>

    <div class="info-section">
        <p><strong>💡 提示：</strong>点击上方按钮切换不同类型的验证码</p>
        <p><strong>✨ 特性：</strong>支持多种验证方式，安全可靠，用户体验佳</p>
    </div>
</div>

<script th:inline="javascript">
    let globalTAC;
    // 获取上下文路径
    const contextPath = /*[[@{/}]]*/ '';

    const config = {
        // 生成接口
        requestCaptchaDataUrl: contextPath + "gen?type=RANDOM",
        // 验证接口
        validCaptchaUrl: contextPath + "check",
        // 验证码绑定的div块
        bindEl: "#captcha-box",
        // 验证成功回调函数
        validSuccess: (res, c, tac) => {
            // 销毁验证码服务
            tac.destroyWindow();
            // 调用登录方法
            this.login(res.data.id);
        }
    }

    const style = {
        // 配置样式， logoURL地址
        // logoUrl: "/images/logo.png"
    }

    function login(token) {
        // 在执行登录时，将验证码token传过去进行二次校验
        $.get(contextPath + "check2?id=" + token, (res) => {
            console.log(res)
            alert("✅ 登录成功！")
        })
    }

    $(function () {
        // 创建 TAC 启动验证码服务
        globalTAC = new TAC(config, style).init();
    })

    function openCaptcha(type, btnElement) {
        if (globalTAC) {
            globalTAC.destroyWindow();
        }

        // 更新按钮状态
        $('.captcha-type-btn').removeClass('active');
        if (btnElement) {
            $(btnElement).addClass('active');
        }

        config.requestCaptchaDataUrl = contextPath + "gen?type=" + type
        globalTAC = new TAC(config, style).init();
    }
</script>
</body>
</html>
