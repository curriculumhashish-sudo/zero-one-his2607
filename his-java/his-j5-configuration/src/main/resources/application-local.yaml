server:
  port: 10501
  servlet:
    context-path: /j5-configuration

spring:
  application:
    name: his-j5-configuration
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/zo_his?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

spring.cloud.service-registry.auto-registration.enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      display-name: ${spring.application.name}
      paths-to-match: '/**'
      packages-to-scan: com.zeroone.star.configuration

knife4j:
  enable: true
  setting:
    language: zh_cn
