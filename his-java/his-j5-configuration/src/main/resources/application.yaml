server:
  port: 10501

spring:
  application:
    name: his-j5-configuration
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/zo_his?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      display-name: ${spring.application.name}
      paths-to-match: '/**'
      packages-to-scan: com.zeroone.star.configuration

knife4j:
  enable: true
  setting:
    language: zh_cn
