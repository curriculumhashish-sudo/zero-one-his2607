# 挂号类型模块本地数据源覆盖配置
# 此文件通过 his-j3-register 的 application.yaml 中 spring.config.import 引入，
# 由于在本模块中后于 Nacos 的 data-source.yaml 导入，优先级更高，
# 从而覆盖 Nacos 共享的 test 库配置，强制使用 zo_his 库。
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.20.130:3306/zo_his?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
