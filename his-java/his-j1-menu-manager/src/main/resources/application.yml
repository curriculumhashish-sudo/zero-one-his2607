server:
  port: ${sp.j1-menu-manager}
  servlet:
    # 设置上下文路径
    context-path: /j1-menu-manager
spring:
  application:
    name: ${sn.j1-menu-manager}
  profiles:
    active: dev
  cloud:
    sentinel:
      transport:
        # 控制台地址
        dashboard: ${sentinel.dashboard}
        port: 8722
      eager: true
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
