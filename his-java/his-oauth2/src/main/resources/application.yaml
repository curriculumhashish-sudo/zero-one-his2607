zo:
  oauth2:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:3001"
      - "https://app.apifox.com"
    mgr-id: "project-manager"
    user-id: "project-app"

server:
  port: ${sp.auth:10400}
spring:
  application:
    name: ${sn.auth:his-oauth2}
  session:
    timeout: 3600s
    redis:
      namespace: spring:session:oauth2
  security:
    oauth2:
      authorizationserver:
        client:
          mgr-client:
            registration:
              client-id: ${zo.oauth2.mgr-id}
              client-authentication-methods:
                - "none"
              authorization-grant-types:
                - "authorization_code"
              redirect-uris:
                - "http://localhost:3000/signin-callback"
                - "https://app.apifox.com/oauth2-browser-callback.html"
              post-logout-redirect-uris:
                - "http://localhost:3000/"
              scopes:
                - "openid"
                - "profile"
            token:
              access-token-time-to-live: 10h
              refresh-token-time-to-live: 24h
            require-authorization-consent: false
            require-proof-key: true
          user-client:
            registration:
              client-id: ${zo.oauth2.user-id}
              client-authentication-methods:
                - "none"
              authorization-grant-types:
                - "authorization_code"
              redirect-uris:
                - "http://localhost:3001/signin-callback"
              post-logout-redirect-uris:
                - "http://localhost:3001/"
              scopes:
                - "openid"
                - "profile"
            token:
              access-token-time-to-live: 10h
              refresh-token-time-to-live: 24h
            require-authorization-consent: false
            require-proof-key: true
