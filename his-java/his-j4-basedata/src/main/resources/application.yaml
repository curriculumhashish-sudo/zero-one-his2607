# 添加本地默认值，防止 Nacos 未连上时解析失败
sn:
  basedata: basedata
sp:
  basedata: 10300

server:
  port: ${sp.basedata}
  servlet:
    context-path: /j4-basedata
spring:
  application:
    name: ${sn.basedata}
  cloud:
    # 确保 Nacos 配置正确
    nacos:
      config:
        server-addr: 192.168.171.128:8848
        namespace: his-dev  # 与 common-dev.yaml 保持一致
        username: nacos
        password: nacos
      discovery:
        server-addr: 192.168.171.128:8848
        namespace: his-dev
        username: nacos
        password: nacos
  datasource:
    url: jdbc:mysql://192.168.171.128:3306/zo_his?useUnicode=true&useSSL=false&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 192.168.171.128
      port: 6379
      password: 123456
   