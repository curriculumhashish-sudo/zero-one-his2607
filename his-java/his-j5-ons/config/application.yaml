server:
  port: 10500
spring:
  application:
    name: his-j5-ons
  config:
    import:
      - optional:nacos:his-j5-ons.yaml
  cloud:
    nacos:
      server-addr: localhost:8848
      username: nacos
      password: nacos
      discovery:
        namespace: public
        group: DEFAULT_GROUP
        enabled: true
      config:
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

springdoc:
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      display-name: ${spring.application.name}
      paths-to-match: '/**'
      packages-to-scan: com.zeroone.star.ons

knife4j:
  enable: true
  setting:
    language: zh_cn
  documents:
    - group: 'default'
      name: '门诊护士站接口文档'
      locations: classpath:docs/
