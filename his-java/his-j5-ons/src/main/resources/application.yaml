server:
  port: 10500
spring:
  application:
    name: his-j5-ons
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      display-name: ${spring.application.name}
      paths-to-match: '/**'
      packages-to-scan: com.zeroone.star.ons