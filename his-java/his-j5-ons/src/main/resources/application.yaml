server:
  port: 10500
  servlet:
    context-path: /j5-ons

# 微服务变量（小组前缀避免冲突）
sn: J5ONS
sp: 10500
spring:
  application:
    name: his-j5-ons
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 192.168.56.1:8848
      username: nacos
      password: nacos
      discovery:
        namespace: public
        group: DEFAULT_GROUP
      config:
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml
        remote-first: true
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/example_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

springdoc:
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      display-name: ${spring.application.name}
      paths-to-match: '/**'
      packages-to-scan: com.zeroone.star.ons

knife4j:
  enable: true
  setting:
    language: zh_cn
  documents:
    - group: 'default'
      name: '门诊护士站接口文档'
      locations: classpath:docs/

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml