server:
  port: ${sp.mg:10002}
spring:
  application:
    name: ${sn.mg:his-mcp-gateway}
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: glm-5
          temperature: 0.7
          max_tokens: 6000
          top_p: 0.9
    mcp:
      server:
        name: mcp-nacos-gateway
        version: 1.0.0
        protocol: streamable
        type: sync
        instructions: "Nacos MCP Gateway - A tool gateway that aggregates multiple MCP Servers"
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
    alibaba:
      mcp:
        nacos:
          namespace: project-dev
          server-addr: 127.0.0.1:8848
          username: nacos
          password: nacos
          register:
            enabled: false
        gateway:
          enabled: false