version: '3.8'

services:
  # ======================== his-j5-ons 服务 ========================
  his-j5-ons:
    build:
      context: ./his-j5-ons
      dockerfile: Dockerfile
    image: his-j5-ons:latest
    container_name: his-j5-ons
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xms256m -Xmx256m
      - SPRING_ARGS=--spring.profiles.active=docker --spring.cloud.nacos.server-addr=121.43.236.176:9080 --spring.cloud.nacos.username=nacos --spring.cloud.nacos.password=nacos
    ports:
      - "10500:10500"
    networks:
      - his-net

  # ======================== his-j5-configuration 服务 ========================
  his-j5-configuration:
    build:
      context: ./his-j5-configuration
      dockerfile: Dockerfile
    image: his-j5-configuration:latest
    container_name: his-j5-configuration
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xms256m -Xmx256m
      - SPRING_ARGS=--spring.profiles.active=docker --spring.cloud.nacos.server-addr=121.43.236.176:9080 --spring.cloud.nacos.username=nacos --spring.cloud.nacos.password=nacos
    ports:
      - "10501:10501"
    networks:
      - his-net

networks:
  his-net:
    driver: bridge
