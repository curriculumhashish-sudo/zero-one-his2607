version: '3.8'

services:
  # ======================== MySQL 8.0 ========================
  mysql:
    image: mysql:8.0
    container_name: his-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "zo_his"
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d
    networks:
      - his-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ======================== Nacos 3.x（兼容 nacos-client 3.1.1）========================
  nacos:
    image: nacos/nacos-server:v3.1.0
    container_name: his-nacos
    restart: unless-stopped
    environment:
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=256m
      - JVM_XMN=128m
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - TZ=Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    networks:
      - his-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # ======================== Nacos 配置初始化（一次性） ========================
  nacos-init:
    image: curlimages/curl:8.7.1
    container_name: his-nacos-init
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - his-net
    volumes:
      - ./nacos-configs:/configs:ro
      - ./scripts/init-nacos-config.sh:/init-nacos-config.sh:ro
    entrypoint: ["/bin/sh", "/init-nacos-config.sh"]

  # ======================== his-j5-ons 服务 ========================
  his-j5-ons:
    build:
      context: ./his-j5-ons
      dockerfile: Dockerfile
    image: his-j5-ons:latest
    container_name: his-j5-ons
    restart: unless-stopped
    depends_on:
      nacos-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms256m -Xmx256m
      - SPRING_ARGS=--spring.profiles.active=docker --spring.cloud.nacos.server-addr=nacos:8848 --spring.cloud.nacos.username=nacos --spring.cloud.nacos.password=nacos
    ports:
      - "10500:10500"
    networks:
      - his-net

  # ======================== his-j5-configuration 服务 ========================
  his-j5-configuration:
    build:
      context: ./his-j5-configuration
      dockerfile: Dockerfile
    image: his-j5-configuration:latest
    container_name: his-j5-configuration
    restart: unless-stopped
    depends_on:
      nacos-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms256m -Xmx256m
      - SPRING_ARGS=--spring.profiles.active=docker --spring.cloud.nacos.server-addr=nacos:8848 --spring.cloud.nacos.username=nacos --spring.cloud.nacos.password=nacos
    ports:
      - "10501:10501"
    networks:
      - his-net

volumes:
  mysql_data:
  nacos_data:
  nacos_logs:

networks:
  his-net:
    driver: bridge
