server:
  port: ${sp.gateway:10402}
spring:
  application:
    name: ${sn.gateway:his-gateway}
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:public.pem
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: oauth2-auth-route
              uri: lb://${sn.auth:his-oauth2}
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            - id: login-route
              uri: lb://${sn.login:his-login}
              predicates:
                - Path=/login/**

zo:
  cloud:
    starter:
      gateway:
        open-authorization: true
        white-paths:
          - "/actuator/**"
          - "/captcha/**"
          - "/auth/oauth2/token"
          - "/login/auth-login"
          - "/login/refresh-token"
          - "/doc.html"
          - "/v3/api-docs/**"
          - "/*/v3/api-docs"
          - "/webjars/**"
        inner-paths:
          - "/login/current-user"
          - "/login/get-menus"
          - "/login/logout"
          - "/chat/**"

knife4j:
  gateway:
    enabled: true
    strategy: discover
    discover:
      enabled: true
      version: openapi3
      excluded-services:
        - ${sn.gateway:his-gateway}
        - ${sn.auth:his-oauth2}
