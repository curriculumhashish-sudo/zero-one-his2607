  field:
    scope: "使用范围：outpatient（门诊）或 inpatient（住院），默认 outpatient"
    pageIndex: "页码，从 1 开始，默认 1"
    pageSize: "每页数量，范围 1-100，默认 20"
    keyword: "可选关键字，匹配药材编码、名称或规格，默认空字符串"
    id: 药品定义主键
    code: 药材编码
    name: 药材名称
    specification: "规格；无规格时返回空字符串"
    defaultDose: "默认单次剂量；药品定义未配置时按 10 返回"
    doseUnit: 默认剂量单位
    retailPrice: "有效 SALE 零售价，单位为元"
    categoryCode: 药品分类编码
    category: 药品分类名称
    inventoryQuantity: "对应门诊或住院中药房的有效库存汇总数量"
    inventoryUnit: 库存单位
