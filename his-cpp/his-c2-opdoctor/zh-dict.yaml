prescription3:
  tags:
    tag: 开立医嘱

  batchDelete:
    summary: 删除待签发医嘱
    description: "软删除 DRAFT 医嘱；选中组内任意医嘱时删除整个组。支持药品、服务和器材医嘱。业务码：21001 参数错误、21002 医嘱不存在、21003 状态错误、21004 分组错误、21005 范围不一致、21006 并发更新、21007 数据库错误。"

  mergeGroup:
    summary: 合并待签发医嘱组
    description: "将至少两个独立医嘱或已有医嘱组合并为新组。允许跨医嘱类型，groupId 由后端生成。业务码：21001 参数错误、21002 医嘱不存在、21003 状态错误、21004 分组错误、21005 范围不一致、21006 并发更新、21007 数据库错误。"

  splitGroup:
    summary: 拆分待签发医嘱组
    description: "选中组内任意医嘱后拆分整个组，全部成员恢复为独立医嘱，不恢复历史分组。业务码：21001 参数错误、21002 医嘱不存在、21003 状态错误、21004 分组错误、21005 范围不一致、21006 并发更新、21007 数据库错误。"

  field:
    orderId: "医嘱 ID，长度 1-64"
    orderType: "医嘱类型：MEDICATION（药品）、SERVICE（服务）、DEVICE（器材）"
    deleteOrders: "待删除医嘱；选择组内成员会自动扩展为整个组，最多传 200 项"
    mergeOrders: "待并组医嘱；至少包含两个独立医嘱或已有组，最多传 200 项"
    splitOrders: "待拆组医嘱；可传组内任意成员，后端按完整组拆分，最多传 200 项"
    success: 操作是否成功
    affectedCount: 实际受影响的医嘱条数
    groupId: 后端生成的雪花分组 ID
    message: 操作结果说明
