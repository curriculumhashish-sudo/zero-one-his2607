prescription3:
 tags:
  tag: 开立医嘱

 batchDelete:
  summary: 删除待签发医嘱
  description: "软删除 DRAFT 医嘱；选中组内任意医嘱时删除整个组。仅允许 IN_PROGRESS 就诊，version 为当前医嘱列表整体版本。支持药品、服务和器材医嘱。业务码：21001 参数错误、21002 记录不存在、21003 状态错误、21004 分组错误、21005 范围不一致、21006 版本冲突、21007 数据库错误。"

 mergeGroup:
  summary: 合并待签发医嘱组
  description: "将至少两个独立医嘱或已有医嘱组合并为新组。仅允许 IN_PROGRESS 就诊，version 为当前医嘱列表整体版本。允许跨医嘱类型，groupId 由后端生成。业务码：21001 参数错误、21002 记录不存在、21003 状态错误、21004 分组错误、21005 范围不一致、21006 版本冲突、21007 数据库错误。"

 splitGroup:
  summary: 拆分待签发医嘱组
  description: "选中组内任意医嘱后拆分整个组，全部成员恢复为独立医嘱，不恢复历史分组。仅允许 IN_PROGRESS 就诊，version 为当前医嘱列表整体版本。业务码：21001 参数错误、21002 记录不存在、21003 状态错误、21004 分组错误、21005 范围不一致、21006 版本冲突、21007 数据库错误。"

