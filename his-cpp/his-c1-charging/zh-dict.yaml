charging:
  settle:
    tag: 收费工作站-住院结算
    getCostDetail:
      summary: 获取患者费用明细清单
    getHistory:
      summary: 获取患者历史结算记录
    settle:
      summary: 住院结算
    field:
      patientId: 患者主键
      patientName: 患者姓名
      encounterId: 住院就诊主键
      historyEncounterId: 住院就诊主键，为空时查询患者全部住院记录
      encounterBusNo: 住院号
      accountId: 就诊账户主键
      chargeItemId: 收费明细主键
      chargeItemIds: 本次结算的收费明细主键列表
      chargeBusNo: 收费明细业务流水号
      prescriptionNo: 处方号
      itemName: 收费项目名称
      chargeCategoryCode: 费用类别编码
      chargeCategoryName: 费用类别名称
      quantityValue: 数量
      quantityUnit: 数量单位
      unitPrice: 单价
      totalPrice: 明细总价
      chargeStatusEnum: 收费明细状态，ALL表示全部
      occurrenceTime: 费用发生时间
      performingOrgName: 执行科室名称
      entererName: 录入人姓名
      totalAmount: 费用总额
      settledAmount: 已结算金额
      unsettledAmount: 待结算金额
      costDetailItems: 费用明细列表
      historyStatusEnum: 结算状态，ALL表示包含结算和退结算记录
      settlementId: 结算记录主键
      paymentId: 支付流水主键
      paymentDetailId: 支付明细主键
      paymentNo: 支付流水号
      kindEnum: 流水类型，SETTLEMENT为结算，REVERSAL为退结算
      displayAmount: 应付金额
      tenderedAmount: 实收金额
      returnedAmount: 找零金额
      billDate: 结算时间，格式yyyy-MM-dd HH:mm:ss
      invoiceId: 发票主键
      setlId: 医保结算标识
      paymentDetails: 支付明细列表
      payEnum: 支付方式，支持CASH、WECHAT、ALIPAY、BANK_CARD、ACCOUNT、INSURANCE
      paymentAmount: 支付金额
      returnAmount: 支付明细退款金额
      payTransNo: 第三方支付流水号，现金支付可为空
      payTransDate: 支付时间
      paymentResultEnum: 支付结果
      contractNo: 费用性质合同编号
      remark: 结算备注
      preSettleId: 预结算记录主键
      settleResultStatus: 结算结果状态
      settledAt: 结算完成时间
