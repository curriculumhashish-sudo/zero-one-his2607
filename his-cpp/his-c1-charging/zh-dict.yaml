charging:
 refund:    
  tag: 收费工作站-门诊退费
      


xbzml:
  charging:
    refund:
      get-patient-list:
        summary: 获取患者队列（分页+条件）
      get-item-list:
        summary: 获取患者缴费项
      verify-refund:
        summary: 确认退费项目是否可退
      execute-refund:
        summary: 执行退费
      prepare-print:
        summary: 退费打印准备（回传打印模版）
      confirm-print:
        summary: 确认退费打印是否成功
      field:
        # get patient
        keyword: 查询关键字（患者姓名、就诊ID等）
        queueTabCode: 队列标签（ALL-全部、PENDING-待退费、SETTLED-已退费）
        encounterId: 就诊ID
        encounterBusNo: 就诊流水号
        patientId: 患者ID
        patientName: 患者姓名
        genderCode: 性别编码
        genderEnumText: 性别
        ageText: 年龄
        queueLabelCode: 队列标签编码
        chargeItemStatusSummary: 退费状态
        organizationName: 就诊机构
        doctorName: 医生姓名
        startTime: 开始时间
        totalAmount: 总金额
        paidAmount: 已付金额
        # get item
        detailViewCode: 视图类型编码（PENDING-待退费 / SETTLED-已退费）
        paymentId: 支付记录ID
        paymentBusNo: 支付流水号
        paymentStatusEnum: 支付状态枚举码
        paymentStatusEnumText: 支付状态枚举显示文本
        entererUserId: 录入人用户ID
        collectorName: 收款人姓名
        halfRefundOnPayment: 是否为支付级别半退
        refundingLines: 退费行列表
        preservedLines: 保留行列表
        chargeItemId: 收费项目ID
        chargeItemStatusEnum: 收费项目状态枚举码
        chargeItemStatusEnumText: 收费项目状态枚举显示文本
        itemDisplayName: 项目显示名称
        lineTotalAmount: 行合计金额
        refundableAmount: 可退总金额
        originalPayChannelCodes: 原始支付渠道编码列表
        paymentGroups: 支付组列表
        # pagination
        content: 当前页数据列表
        totalCount: 总记录数
        pageNo: 当前页码
        # verify refund
        refundingChargeItemIds: 待退费收费项目ID列表
        allowed: 是否允许退费
        rejectReasonCode: 拒绝原因编码
        # execute refund
        billDate: 账单日期
        originalPaymentId: 原始支付记录ID
        refundPaymentDetails: 退费支付明细列表
        amount: 退款金额
        payChannelCode: 支付渠道编码
        success: 是否执行成功
        reversePaymentId: 冲正支付记录ID
        halfRefundExecuted: 是否为半退
        insuranceRevoked: 医保是否已撤销
        # prepare print
        scenarioCode: 场景编码
        templateVersion: 模版版本号
        traceId: 打印任务追踪ID
        busNo: 业务流水号
        # confirm print
        status: 打印状态
        printData: 实际打印数据
        bizRef: 业务参考信息
        copies: 打印份数
        clientType: 客户端类型

