# 包装、拆零相关字段
    packaging: 包装单位
    packsplit: 包装/拆零倍数
    split: 拆零单位

# 库存警戒阈值字段
    warningmax: 警戒线最高值(库存单位)
    warningmin: 警戒线最低值(库存单位)

# 辅助检索字段
    pinyin: 拼音码
    wubi: 五笔码

