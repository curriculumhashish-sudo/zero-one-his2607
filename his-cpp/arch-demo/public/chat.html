<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>零壹聊天室</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="static/css/chat.css">
    <script src="static/js/chat.js"></script>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">
            <i class="fas fa-comments"></i>
        </div>
        <h1>零壹聊天室</h1>
    </div>

    <div class="form-group">
        <label for="token"> <i class="fas fa-key"></i>发送者凭证： </label>
        <div class="input-icon">
            <i class="fas fa-lock"></i>
        </div>
        <input type="password" id="token" placeholder="输入登录凭证"/>
    </div>

    <div class="form-group">
        <button id="connectBtn" onclick="init()">
            <i class="fas fa-plug"></i>连接服务器
        </button>
    </div>

    <div class="form-group">
        <label for="receiverId">
            <i class="fas fa-user"></i>接收者编号：
        </label>
        <div class="input-icon">
            <i class="fas fa-id-card"></i>
        </div>
        <input
                id="receiverId"
                placeholder="接收者编号 (输入 'all' 广播)"
                value="all"
        />
    </div>

    <div class="form-group">
        <label for="message">
            <i class="fas fa-comment-dots"></i>消息内容：
        </label>
        <textarea id="message" placeholder="输入消息内容"></textarea>
    </div>

    <div class="btn-container">
        <button onclick="send()">
            <i class="fas fa-paper-plane"></i>发送消息
        </button>
        <button id="closeBtn" onclick="closeConnect()">
            <i class="fas fa-power-off"></i>关闭连接
        </button>
    </div>

    <div id="output"></div>

    <footer>
        <i class="fas fa-code"></i>
        <p>零壹聊天室 v1.0</p>
        <div class="online-status">
            <div class="online-dot"></div>
            <span>离线</span>
        </div>
    </footer>
</div>
<script>
    // 初始加载时添加示例消息
    document.addEventListener("DOMContentLoaded", function () {
        writeToScreen("欢迎使用零壹聊天室", "info");
        writeToScreen("请输入凭证并连接服务器", "info");
    });
</script>
</body>
</html>
