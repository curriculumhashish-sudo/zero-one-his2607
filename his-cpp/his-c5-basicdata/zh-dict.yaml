  tree-list:
    summary: 获取病区树形列表
  add-location:
    summary: 新增病区地点
  query-room-by-id:
    summary: 根据ID查询病房
  query-bed-by-id:
    summary: 根据ID查询病床
  modify:
    summary: 修改病区信息
  remove:
