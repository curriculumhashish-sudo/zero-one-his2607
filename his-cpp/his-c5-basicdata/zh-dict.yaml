# ============================================================
# 中文词典 — his-c5-basicdata
# 格式: <模块>.<分类>.<键> — 中文描述
# ============================================================

# ============================================================
# 患者管理 (pat) — 患者查询/分页/删除/CRUD
# ============================================================
pat:
  tag: 患者管理
  delete:
    summary: 删除患者
  page:
    success: 患者分页查询接口访问成功
    summary: 分页查询患者列表
    query:
      field:
        name: 患者姓名(模糊查询)
        idCard: 患者证件号码
    dto:
      field:
        id: 患者主键ID
        busNo: 病历号
        name: 患者姓名
        idCard: 身份证号
        gender: 性别(1男/2女)
        age: 年龄
  select:
    page:
      summary: 分页查询弹窗可选患者列表
      success: 查询可选患者列表成功
    gender:
      male: 男性
      female: 女性
    query:
      field:
        keyword: 搜索关键词(姓名/病历号/证件号)
    dto:
      field:
        medicalNo: 病历号
        name: 患者姓名
        gender: 性别
        birthDay: 出生日期
        age: 年龄
        phone: 联系电话
        idCard: 身份证号
  query-by-id:
    summary: 根据ID查询患者详情
  add:
    summary: 新增患者
  modify:
    summary: 修改患者信息
  field:
    id: 患者ID
    name: 患者姓名
    age: 年龄
    sex: 性别

# ============================================================
# 科室管理 (dept) — 科室 CRUD + 批量启停 + 组织架构树
# ============================================================
dept:
  tag: 科室管理
  add:
    summary: 新增科室
  modify:
    summary: 修改科室
  remove:
    summary: 删除科室
  batch-status:
    summary: 批量启停科室
    success:
      enable: 批量启用科室成功
      disable: 批量停用科室成功
    fail:
      empty: 批量操作失败，无匹配科室数据
    validate:
      body-invalid: 请求体JSON格式错误
      id-list-required: deptIdList不能为空
      id-list-empty: deptIdList不能为空
      id-empty: 科室ID不能为空字符串
      id-not-digit: 科室ID仅允许数字字符
      id-type-string: 科室ID必须为字符串类型
      id-duplicate: 存在重复的科室ID
      status-required: targetStatus不能为空
      status-invalid: targetStatus仅支持0(停用)或1(启用)
    error:
      id-convert-fail: 科室ID格式转换失败
      no-match: 批量操作失败，无匹配科室数据
      partial-fail: 批量操作部分失败，已全部回滚
      cascade-fail: 级联启用子科室失败，已全部回滚
      has-active-child: 存在启用的子科室，请先停用子科室
      parent-inactive: 父科室未启用，请先启用父科室
  endpoints:
    nameTree: 获取科室名称树
    listTree: 获取科室列表树
    detail: 获取科室详情
  organizationQuery:
    endpoints:
      nameTree: 获取科室名称树
      listTree: 获取科室列表树
      detail: 获取科室详情
    errors:
      invalidParameter: 查询参数不合法
      notFound: 科室不存在
      serverError: 科室查询失败
    warnings:
      enumMongoUnavailable: 科室信息查询成功，但MongoDB不可用，已返回原始枚举编码
      enumDataIncomplete: 科室信息查询成功，但未找到完整的枚举映射，已返回原始枚举编码
    fields:
      id: 科室唯一标识，JSON类型为字符串，禁止按数字处理
      name: 科室名称
      parentId: 上级机构或科室唯一标识，根节点返回null，JSON类型为字符串
      defDoctorId: 默认医生唯一标识，未配置默认医生时返回null，JSON类型为字符串
      busNo: 科室业务编码
      caty: 科别名称
      typeEnum: 科室类型编码，返回数据库保存的编码原值
      typeEnumDictText: 科室类型中文名称，MongoDB枚举查询失败或编码不存在时返回null
      classEnum: 科室类别编码，返回数据库保存的编码原值
      classEnumDictText: 科室类别中文名称，MongoDB枚举查询失败或编码不存在时返回null
      statusEnum: 科室状态编码，返回数据库保存的编码原值
      statusEnumDictText: 科室状态中文名称，MongoDB枚举查询失败或编码不存在时返回null
      enumMappingSuccess: MongoDB枚举中文映射是否完整，false时原始编码和其他科室信息仍正常返回
      ybNo: 医保编码
      ybName: 医保名称
      medinsId: 医疗机构标识
      medinsAdmdvs: 医保区划编码
      medinsType: 医疗机构类型编码
      medinsLv: 医疗机构等级编码
      pyStr: 科室名称拼音检索码
      wbStr: 科室名称五笔检索码
      displayOrder: 显示顺序，JSON类型为整数，同级节点按此字段升序排列
      children: 直接下级科室数组，叶子节点返回空数组
    queries:
      typeEnum: 科室类型编码，可选，最长255个字符，使用精确匹配，与其他筛选条件按AND组合
      classEnum: 科室类别编码，可选，最长255个字符，使用精确匹配，与其他筛选条件按AND组合
      statusEnum: 科室状态编码，可选，最长255个字符，仅科室列表树使用精确匹配，与其他筛选条件按AND组合
      keyword: 关键词，可选，最长500个字符，部分匹配科室名称、类型编码、类别编码、状态编码、医保编码、医保名称、机构标识、医保区划、机构类型和机构等级；命中节点时保留完整祖先路径，不自动返回未命中的后代
      excludeId: 编辑上级科室时需要排除的科室唯一标识，可选，最长64个字符，同时排除该节点及其全部后代，JSON类型为字符串
      id: 科室唯一标识，详情接口必填，去除首尾空白后查询，最长64个字符，JSON类型为字符串
  field:
    id: 科室编号
    name: 科室名称
    type-enum: 类型
    class-enum: 类别
    parent-id: 上级组织编号
    yb-no: 医保编码
    yb-name: 医保名称
    medins-id: 机构标识
    medins-admdvs: 医保区划
    medins-type: 机构类型
    medins-lv: 机构等级
    py-str: 拼音码
    wb-str: 五笔码
    def-doctor-id: 默认医生编号
    caty: 科别
    display-order: 显示顺序
    status-enum: 状态
    active-flag: 是否启用
    deptIdList: 批量科室ID数组
    targetStatus: 目标启停状态(0停用/1启用)

# ============================================================
# 供应商管理 (sup) — 供应商 CRUD + 批量操作
# ============================================================
sup:
  tag: 供应商管理
  query-one:
    summary: 根据ID或编号查询供应商详情
  query-all:
    summary: 条件分页查询供应商列表
  add:
    summary: 新增供应商
  modify:
    summary: 修改供应商
  batch-enable-disable:
    summary: 批量启/停用供应商
  batch-remove:
    summary: 批量删除供应商
  name:
    query: 供应商/生产厂商名称
  field:
    id: 主键编号
    supId: 供应商编号
    code: 供应商编号
    ids: 供应商ID列表
    keyword: 搜索关键字(名称)
    busNo: 业务编号
    name: 供应商名称
    typeEnum: 供应商类型(生产厂家/供应商等)
    creditCode: 统一信用代码
    legalRepresentative: 法定代表人
    address: 地址
    contact: 电话邮箱
    pyStr: 拼音码
    wbStr: 五笔码
    pinyin: 拼音
    wubi: 五笔
    phone: 电话
    email: 邮箱
    bankName: 开户银行
    bankAccount: 银行账号
    orgId: 所属机构ID
    displayOrder: 显示顺序
    statusEnum: 状态枚举值(NORMAL/DISABLED)
    note: 备注说明
  query:
    code: 供应商编号
    name: 供应商名称
    type: 供应商类型
    keyword: 搜索关键词
    statusEnum: 按状态筛选

# ============================================================
# 库房药房管理 (pharm)
# ============================================================
pharm:
  tag: 库房药房管理
  endpoints:
    nameList: 获取库房药房名称
    list: 获取库房药房列表条件+分页
    add: 新增库房药房
    modify: 修改库房药房
    remove: 删除库房药房
    status: 切换库房药房启停状态
  field:
    id: 编号
    name: 库房药房名称
    formEnum: 类型(PHARMACY药房/WAREHOUSE库房)
    statusEnum: 状态(ACTIVE启用/INACTIVE停用)
    busNo: 业务编号
    organizationId: 所属机构
    displayOrder: 显示顺序
    pyStr: 拼音码
    wbStr: 五笔码
    parentId: 上级库房药房
    createBy: 创建人
    updateBy: 修改人
    createTime: 创建时间
    updateTime: 修改时间
  queries:
    keyword: 搜索关键词(模糊匹配名称)
    formEnum: 按类型筛选(PHARMACY/WAREHOUSE)
    statusEnum: 按状态筛选(ACTIVE/INACTIVE)
  result:
    empty: 暂无数据
    add_success: 新增成功
    add_fail: 新增失败
    name_duplicate: 库房药房名称已存在
    modify_success: 修改成功
    modify_fail: 修改失败
    remove_success: 删除成功
    remove_fail: 删除失败
    status_success: 状态更新成功
    status_fail: 状态更新失败

# ============================================================
