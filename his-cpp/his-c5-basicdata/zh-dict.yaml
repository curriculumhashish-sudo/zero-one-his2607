    organization-id: 机构编号
    pyStr: 拼音码
    wbStr: 五笔码
    typeJson: 类型属性JSON
    version: 乐观锁版本号
    children: 子节点列表
    roomId: 病房编号
    bedId: 病床编号
    wardAreaId: 病区编号
    wardRoomId: 病房编号
    status: 状态
