services:
  mysql8:
    image: mysql:8.4.9
    networks:
      - mysql
    container_name: mysql8
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      TZ: Asia/Shanghai
    volumes:
      - ./conf:/etc/mysql/conf.d
      - ./log:/var/log/mysql
      - ./data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    command: 
      - --lower_case_table_names=1
networks:
  mysql:
    name: mysqldb
    driver: bridge