services:
  app:
    image: 'docker.io/jc21/nginx-proxy-manager:latest'
    networks:
      - ngproxy
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    environment:
      - TZ=Asia/Shanghai
networks:
  ngproxy:
    name: ngproxy
    driver: bridge