server:
  port: 8081
spring:
  application:
    name: seata-namingserver
logging:
  config: classpath:logback-spring.xml
  file:
    path: ${log.home:${user.home}/logs/seata}
heartbeat:
  threshold: 90000
  period: 60000
seata:
  security:
    secretKey: ${SEATA_SECRET_KEY:YSoD9q8eEALfqbe1q9KRlotpeoqqxisq2xZxurCIPtqBAda6N1R9OAbRm4Q3rJ71}
    tokenValidityInMilliseconds: 1800000
    csrf-ignore-urls: /naming/v1/**,/api/v1/naming/**
    ignore:
      urls: /,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.jpeg,/**/*.ico,/api/v1/auth/login,/version.json,/naming/v1/health,/error
console:
  user:
    username: ${SEATA_CONSOLE_USERNAME:seata}
    password: ${SEATA_CONSOLE_PASSWORD:seata}