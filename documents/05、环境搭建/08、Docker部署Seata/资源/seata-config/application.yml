server:
  port: 8091
spring:
  application:
    name: seata-server
  main:
    web-application-type: none
logging:
  config: classpath:logback-spring.xml
  file:
    path: ${log.home:${user.home}/logs/seata}
  extend:
    logstash-appender:
      # off by default
      enabled: false
      destination: 127.0.0.1:4560
    kafka-appender:
      # off by default
      enabled: false
      bootstrap-servers: 127.0.0.1:9092
      topic: logback_to_logstash
      producer:
        acks: 0
        linger-ms: 1000
        max-block-ms: 0
    metric-appender:
      # off by default
      enabled: false
seata:
  config:
    type: nacos
    nacos:
      server-addr: 192.168.28.132:8848
      group: SEATA_GROUP
      namespace: ""
      cluster: default
      username: nacos
      password: nacos
      data-id: seataServer.properties
  registry:
    type: nacos,seata
    nacos:
      application: seata-server
      server-addr: 192.168.28.132:8848
      group: SEATA_GROUP
      namespace: ""
      cluster: default
      username: nacos
      password: nacos
    seata:
      server-addr: 192.168.28.132:8092
      cluster: default
      namespace: public
      heartbeat-period: 5000
      metadata-max-age-ms: 30000
      username: ${SEATA_CONSOLE_USERNAME:seata}
      password: ${SEATA_CONSOLE_PASSWORD:seata}
      tokenValidityInMilliseconds: 1740000